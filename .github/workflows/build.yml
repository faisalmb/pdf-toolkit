# Tests on every push, and builds Windows / macOS / Linux packages.
# Pushing a tag like v11.0.0 also publishes the packages as a GitHub Release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: Headless tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python make_test_fixtures.py
          python test_headless.py

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm PDFMerger.spec
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer.iss

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: PYTHON=python bash build_mac.sh

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: PYTHON=python bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMerger-${{ runner.os }}
          path: installer_output/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*
