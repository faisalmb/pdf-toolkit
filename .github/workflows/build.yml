# Every push to main: test, build Windows / macOS / Linux packages, and publish
# them as a new GitHub Release tagged v<version>-build.<run number>.
# Pushing a tag like v11.0.0 publishes a release on that tag instead.
# Pull requests only run the tests. Commits that change only *.md files are skipped.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt
      - name: Headless tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          python make_test_fixtures.py
          python test_headless.py

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm PDFMerger.spec
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer.iss

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: PYTHON=python bash build_mac.sh

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: PYTHON=python bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PDFMerger-${{ runner.os }}
          path: installer_output/*

  # One job publishes the release after all three builds succeed,
  # so the release is created once and always has every package.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release tag and title
        id: meta
        run: |
          VERSION=$(sed -n "s/^APP_VERSION = '\(.*\)'/\1/p" PDFMerger.spec)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
            NAME="PDF Merger $GITHUB_REF_NAME"
          else
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            NAME="PDF Merger ${VERSION} (build ${GITHUB_RUN_NUMBER})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: "true"
          files: packages/*
